name: v2.7 regression

on:
  push:
    branches: [v2.7-observability-lab]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile app.py vixion_v27.py launcher_v27.py tests/test_v27_observability.py tests/test_v27_launcher.py
      - name: Fetch main for cross-version invariants
        run: git fetch --depth=1 origin main
      - name: Regression invariants
        run: python -m unittest discover -s tests -v
